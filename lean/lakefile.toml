name = "cuboid2"
version = "0.1.0"
defaultTargets = ["Cuboid2"]
# Keep each Lean compiler process at its smallest supported task pool.  Mathlib
# initialization requires a task manager, so `-j0` is not usable here.
moreLeanArgs = ["-j1"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "Cuboid2"
