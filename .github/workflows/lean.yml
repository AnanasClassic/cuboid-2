name: Lean formalization

on:
  push:
    branches:
      - main
    paths:
      - "lean/*.lean"
      - "lean/**/*.lean"
      - "lean/lakefile.toml"
      - "lean/lean-toolchain"
      - "lean/lake-manifest.json"
      - "scripts/reproduce_lean.sh"
      - ".github/workflows/lean.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lean/*.lean"
      - "lean/**/*.lean"
      - "lean/lakefile.toml"
      - "lean/lean-toolchain"
      - "lean/lake-manifest.json"
      - "scripts/reproduce_lean.sh"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
      - name: Restore Lean project build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: lean/.lake/build
          key: cuboid2-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-${{ hashFiles('lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            cuboid2-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-${{ hashFiles('lean/lake-manifest.json') }}-
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Build Lean project
        working-directory: lean
        shell: bash
        env:
          # Run Lake tasks synchronously so only one memory-heavy compiler is active.
          LEAN_NUM_THREADS: "0"
        run: |
          set -euo pipefail

          report_resources() {
            echo "Lean build heartbeat: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            free -h
            ps -eo pid,ppid,%cpu,%mem,rss,etime,stat,comm --sort=-rss | sed -n '1,12p'
          }

          heartbeat() {
            while sleep 300; do
              report_resources
            done
          }

          report_resources
          heartbeat &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

          echo "Lean task workers: $LEAN_NUM_THREADS"
          lake build
      - name: Save Lean project build cache
        if: success()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: lean/.lake/build
          key: cuboid2-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-${{ hashFiles('lean/lake-manifest.json') }}-${{ github.sha }}
      - name: Public theorem axiom audit
        run: CUBOID_SKIP_BUILD=1 bash scripts/reproduce_lean.sh complete
